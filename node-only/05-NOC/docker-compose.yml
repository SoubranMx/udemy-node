services:
  mongo-db:
    image: mongo:6.0.6
    restart: always
    environment:
      #VAR NAME: ${ENV_VARIABLE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - ./mongo:/data/db
    ports:
      #pc port: mongo port
      - 27017:27017
